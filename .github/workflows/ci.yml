name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck server
        run: npm --workspace server run lint
      - name: Run server tests
        run: npm --workspace server run test
